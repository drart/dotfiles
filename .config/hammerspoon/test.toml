
leader_key = "f18"        # required, the leader key that starts the sequence
# leader_key_mods = ""      # optional, default "", not recommended - a dedicated leader key is better
                             # supports cmd ctrl alt shift
auto_reload = true        # optional, default true, reload when any file in this directory is saved
toast_on_reload = true    # optional, default false, show a toast when the config is reloaded
show_ui = true            # optional, default true, show the ui with your key maps
key_maps_per_line = 3     # optional, default 5, number of key maps per line in the ui

t = "iTerm"

# or a url
g = "https://google.com" # urls go to velja (I have this set up for a prompt)
y = "cmd:open 'velja:open?url=https://youtube.com&app=com.apple.Safari'"

p = ["hs:spoon.Cherry:start()", "Pomodoro"]


# Window management courtesy of Aerospace
[w]
label = "[Aerospace]"
f = ["cmd:aerospace fullscreen", "Fullscreen"]
m = ["cmd:aerospace mute-toggle", "Mute Toggle"]

[w.l]
label = ["Layout Modes"]
t = ["cmd:aerospace layout tiling", "Tiling"]
f = ["cmd:aerospace layout floating", "Floating"]

[w.m]
label = ["Move"]
j = ["cmd:aerospace move down", "Down"]
k = ["cmd:aerospace move up", "Down"]
h = ["cmd:aerospace move left", "left"]
l = ["cmd:aerospace move right", "right"]
a = ["cmd:aerospace move-node-to-workspace a", "a"]
s = ["cmd:aerospace move-node-to-workspace s", "s"]



[o]
label = "[Obsidian]"
o = "Obsidian"
n = "menu:Obsidian|File>New Note"

# this group is handy to copy over
# for quick access to your config
[h]
label = "[hammerspoon]"
# c = "code: ~/.hammerspoon"
r = "reload" # reserved for reloading your hammerspoon config (helpful when auto_reload is false)
z = ["hs:hs.alert('Hello, world!')", "Hello"]

